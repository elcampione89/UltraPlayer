name: Build APKs
# Signed with the release key from repo secrets (MTV_KEYSTORE_B64 etc.)

on:
  push:
    branches: [ main, master ]
    paths-ignore: [ 'panel/**', '**.md' ]
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (leave blank to use gradle.properties)'
        required: false
      version_name:
        description: 'Version name (leave blank to use gradle.properties)'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MTV_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MTV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with your release key"
          else
            echo "::warning::No MTV_KEYSTORE_B64 secret - APKs are debug-signed and won't update each other cleanly"
          fi

      - name: Build release APKs
        env:
          MTV_KEYSTORE_PASSWORD: ${{ secrets.MTV_KEYSTORE_PASSWORD }}
          MTV_KEY_PASSWORD: ${{ secrets.MTV_KEY_PASSWORD }}
          MTV_KEY_ALIAS: ${{ secrets.MTV_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          EXTRA=""
          [ -n "${{ github.event.inputs.version_code }}" ] && EXTRA="$EXTRA -PAPP_VERSION_CODE=${{ github.event.inputs.version_code }}"
          [ -n "${{ github.event.inputs.version_name }}" ] && EXTRA="$EXTRA -PAPP_VERSION_NAME=${{ github.event.inputs.version_name }}"
          set -o pipefail
          ./gradlew --no-daemon assembleRelease $EXTRA 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Compiler errors as annotations (readable without log access) ...
          grep -E '^e: |error:|What went wrong' -A3 build.log | head -200 > errors.txt || true
          grep -E '^e: ' build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          grep -E 'What went wrong' -A6 build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          # ... and the full error list on a ci-logs branch
          git config user.name "ci"; git config user.email "ci@localhost"
          git checkout --orphan ci-logs
          git rm -rfq . >/dev/null 2>&1 || true
          cp errors.txt errors-${{ github.run_number }}.txt
          tail -300 build.log > build-tail-${{ github.run_number }}.txt
          git add errors-*.txt build-tail-*.txt
          git commit -qm "build ${{ github.run_number }} errors"
          git push -f origin ci-logs

      - name: Collect APKs
        id: apks
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} out/ \;
          ls -la out
          VN=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          [ -n "${{ github.event.inputs.version_name }}" ] && VN="${{ github.event.inputs.version_name }}"
          echo "version=$VN" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: UltraPlayer-apk
          path: out/*.apk

      - name: Publish release (direct APK links)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apks.outputs.version }}-b${{ github.run_number }}
          name: Ultra Player ${{ steps.apks.outputs.version }} (build ${{ github.run_number }})
          files: out/*.apk
          make_latest: true
